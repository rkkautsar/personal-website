<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Before and after: prefetch the cart during page initialization</title>
  <desc id="desc">Before, page initialization takes about half a second and only then does the cart request begin. After, initialization and the cart request run in parallel; the page reuses the existing promise when cart data is needed and waits only for any remaining request time.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18382d" flood-opacity=".07"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#176b50"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#93a097"/>
    </marker>
  </defs>
  <rect width="1200" height="680" rx="24" fill="#f5f7f3"/>
  <rect x="28" y="26" width="1144" height="628" rx="20" fill="#fff" stroke="#e0e7df" filter="url(#shadow)"/>
  <text x="68" y="82" fill="#1a2a22" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700" letter-spacing="-.7">Prefetch overlaps the wait</text>
  <text x="68" y="114" fill="#65736a" font-family="Inter, system-ui, sans-serif" font-size="16">Same page work and same cart GET; only the request start time changes.</text>

  <!-- Before trace -->
  <rect x="62" y="142" width="1076" height="204" rx="16" fill="#fbfcfa" stroke="#e4e9e3"/>
  <rect x="82" y="160" width="86" height="28" rx="14" fill="#f2eee8"/>
  <text x="125" y="179" text-anchor="middle" fill="#786548" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1">BEFORE</text>
  <text x="184" y="180" fill="#26372d" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700">Request starts after initialization</text>
  <text x="84" y="231" fill="#647169" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">PAGE</text>
  <text x="84" y="251" fill="#647169" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">WORK</text>
  <rect x="205" y="210" width="320" height="58" rx="11" fill="#dcebe1"/>
  <text x="225" y="235" fill="#20553d" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Initialize page</text>
  <text x="225" y="255" fill="#53715c" font-family="Inter, system-ui, sans-serif" font-size="12">about 0.5 seconds</text>
  <text x="84" y="309" fill="#647169" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">CART</text>
  <text x="84" y="329" fill="#647169" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">REQUEST</text>
  <rect x="525" y="288" width="450" height="48" rx="10" fill="#e8eee9"/>
  <rect x="525" y="288" width="450" height="48" rx="10" fill="#aebbb2"/>
  <text x="545" y="318" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">GET cart · wait for response</text>
  <line x1="205" y1="346" x2="1040" y2="346" stroke="#b7c1b9" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
  <text x="205" y="339" fill="#8a958d" font-family="Inter, system-ui, sans-serif" font-size="11">START</text>
  <text x="976" y="318" fill="#65736a" font-family="Inter, system-ui, sans-serif" font-size="12">cart data ready</text>

  <!-- After trace -->
  <rect x="62" y="366" width="1076" height="232" rx="16" fill="#f8fbf7" stroke="#dce8de"/>
  <rect x="82" y="384" width="76" height="28" rx="14" fill="#e2f0e5"/>
  <text x="120" y="403" text-anchor="middle" fill="#176b50" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1">AFTER</text>
  <text x="174" y="404" fill="#26372d" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700">Start the request while the page initializes</text>
  <text x="84" y="454" fill="#647169" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">PAGE</text>
  <text x="84" y="474" fill="#647169" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">WORK</text>
  <rect x="205" y="432" width="320" height="58" rx="11" fill="#dcebe1"/>
  <text x="225" y="457" fill="#20553d" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Initialize page</text>
  <text x="225" y="477" fill="#53715c" font-family="Inter, system-ui, sans-serif" font-size="12">about 0.5 seconds</text>
  <text x="84" y="532" fill="#647169" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">CART</text>
  <text x="84" y="552" fill="#647169" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">REQUEST</text>
  <rect x="205" y="510" width="560" height="48" rx="10" fill="#176b50"/>
  <text x="225" y="540" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">GET cart · request is already in flight</text>
  <circle cx="765" cy="534" r="7" fill="#d9f36a" stroke="#176b50" stroke-width="4"/>
  <text x="788" y="530" fill="#20553d" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Response ready</text>
  <text x="788" y="550" fill="#728078" font-family="Inter, system-ui, sans-serif" font-size="12">request duration varies</text>
  <line x1="525" y1="420" x2="525" y2="570" stroke="#d49b55" stroke-width="2" stroke-dasharray="5 6"/>
  <rect x="442" y="414" width="166" height="24" rx="12" fill="#fff3dc"/>
  <text x="525" y="430" text-anchor="middle" fill="#79562b" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="800" letter-spacing=".4">PAGE READY · DATA NEEDED</text>
  <path d="M525 572h220" fill="none" stroke="#176b50" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="635" y="590" text-anchor="middle" fill="#176b50" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">Reuse the promise; await only if still pending</text>

  <text x="68" y="630" fill="#87928a" font-family="Inter, system-ui, sans-serif" font-size="12">Schematic trace, not to scale. The request duration varies; the page initialization example is about 0.5 seconds.</text>
</svg>
